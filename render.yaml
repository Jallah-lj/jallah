services:
  - type: web
    name: portfolio-cms-api
    runtime: node
    # Persistent disks require a paid instance (Starter ~$7/mo). To deploy on
    # the free plan for testing, set plan: free and delete the `disk:` block —
    # but then DATA_FILE/UPLOAD_DIR live on the ephemeral container filesystem
    # and ALL CMS content + uploaded media reset on every deploy/restart.
    plan: starter
    buildCommand: npm ci --include=dev
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: cms-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Both live on the persistent disk mounted at /var/data so data and
      # uploads survive deploys and restarts.
      - key: DATA_FILE
        value: /var/data/database.json
      - key: UPLOAD_DIR
        value: /var/data/uploads
