services:
  - type: web
    name: portfolio-cms-api
    runtime: node
    plan: free
    # The API persists everything in a JSON file store (server/src/store.ts);
    # Prisma/Postgres is not used at runtime, so no database or migrate step.
    buildCommand: npm ci --include=dev
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATA_FILE
        value: data/database.json
      - key: UPLOAD_DIR
        value: uploads
