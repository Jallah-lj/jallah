services:
  - type: web
    name: portfolio-cms-api
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run db:generate && npm run db:migrate && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: portfolio-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false
      - key: SERVER_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Injected only for services created from this Blueprint. A service created
      # manually in the dashboard will NOT receive it; db:migrate then skips
      # migrations rather than failing the build.
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-postgres
          property: connectionString
      # Flip to "true" once the API reads from PostgreSQL instead of the JSON store.
      - key: DB_MIGRATE_STRICT
        value: "false"
      - key: DATA_FILE
        value: /var/data/database.json
      - key: UPLOAD_DIR
        value: /var/data/uploads

databases:
  - name: portfolio-postgres
    plan: basic-256mb
    databaseName: portfolio
    user: portfolio
